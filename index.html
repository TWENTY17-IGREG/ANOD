<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANOD · Projects</title>
<meta name="description" content="ANOD projects and proofs of concept.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 101 100'%3E%3Crect width='101' height='14' fill='%23C1272D'/%3E%3Cpolygon points='50.5,24 101,100 0,100' fill='%23111'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Black on white, ruled like a spec sheet. Red and green only as small identity marks. */
:root{
  --paper:#fff; --ink:#111; --ink-2:#555; --ink-3:#8a8a8a;
  --hair:#e2e2e2; --soft:#f5f5f5;
  --red:#C1272D; --green:#006233;
  --sans:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.page{max-width:980px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.muted{color:var(--ink-2)}

.top{border-top:4px solid var(--ink)}
header .page{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;letter-spacing:.08em}
.brand svg{fill:var(--ink)} .brand .r{fill:var(--red)}
.brand span{font-weight:400;letter-spacing:0;color:var(--ink-2)}
header nav{display:flex;gap:20px;font-family:var(--mono);font-size:12px}
header nav a{text-decoration:none;color:var(--ink-2)} header nav a:hover{color:var(--ink)}

.title{padding:56px 0 32px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;border-bottom:1px solid var(--ink)}
.title h1{font-size:40px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.title p{margin-top:12px;color:var(--ink-2);max-width:56ch}
.meta{display:grid;grid-template-columns:auto auto;gap:4px 16px;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.meta b{color:var(--ink);font-weight:500}

h2{display:flex;align-items:baseline;gap:12px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:40px 0 12px}
h2 .mono{color:var(--ink-3);font-weight:400}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ink-3);text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:12px 12px 12px 0;border-bottom:1px solid var(--hair);vertical-align:top}
tr.row{cursor:pointer} tr.row:hover td{background:var(--soft)}
td.id{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
td.name a{font-weight:600;text-decoration:none} td.name a:hover{text-decoration:underline}
td.repo a{font-family:var(--mono);font-size:12px}
.status{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.status i{width:8px;height:8px;border:1px solid var(--ink)}
.status.active i{background:var(--green);border-color:var(--green)}
.status.done i{background:var(--ink)}
.status.next i{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.status.paused i{border-style:dashed}
.bar{display:flex;gap:2px;min-width:110px}
.bar span{height:6px;flex:1;background:var(--hair)}
.bar span.on{background:var(--ink)} .bar span.now{background:var(--green)}

.sheet{border-top:1px solid var(--ink);padding:28px 0 40px;scroll-margin-top:16px}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.sheet-head h3{font-size:26px;font-weight:500;letter-spacing:-.01em}
.sheet-head .mono{color:var(--ink-3)}
.summary{margin-top:10px;max-width:68ch;color:#222}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px;margin-top:24px}
dl{display:grid;grid-template-columns:130px minmax(0,1fr);border-top:1px solid var(--hair)}
dt,dd{padding:8px 0;border-bottom:1px solid var(--hair);font-size:14px;overflow-wrap:anywhere}
dt{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);padding-top:10px;padding-right:8px}
.block + .block{margin-top:24px}
.block h4{font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--ink-3);padding-bottom:8px;border-bottom:1px solid var(--hair)}
.stages{list-style:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;margin-top:10px}
.stages li{padding-top:8px;border-top:3px solid var(--hair);font-size:12.5px;color:var(--ink-3)}
.stages li.on{border-top-color:var(--ink);color:var(--ink)}
.stages li.now{border-top-color:var(--green);color:var(--ink);font-weight:600}
.log,.docs{list-style:none}
.log li{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:14px}
.log time{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);padding-top:2px}
.docs li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:14px}
.docs .k{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.none{padding:8px 0;font-size:14px;color:var(--ink-2)}
.err{margin-top:24px;padding:16px;border:1px solid var(--red);font-family:var(--mono);font-size:13px}

footer{border-top:1px solid var(--ink);margin-top:24px}
footer .page{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-top:16px;padding-bottom:40px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.mim{display:inline-flex;align-items:center;gap:8px}
.mim i{width:10px;height:10px;display:inline-block}

@media (max-width:720px){
  header nav{display:none}
  .title{grid-template-columns:1fr}
  .title h1{font-size:32px}
  .cols{grid-template-columns:1fr;gap:24px}
  dl{grid-template-columns:110px minmax(0,1fr)}
  .stages{grid-template-columns:1fr}
  .stages li{border-top:0;border-left:3px solid var(--hair);padding:4px 0 4px 10px}
  .stages li.on{border-left-color:var(--ink)} .stages li.now{border-left-color:var(--green)}
  .log li{grid-template-columns:1fr;gap:0}
  .hide-sm{display:none}
}
@media print{ .sheet{break-inside:avoid} tr.row:hover td{background:none} header nav{display:none} }
</style>
</head>
<body>
<div class="top"></div>
<header>
  <div class="page">
    <a class="brand" href="#" aria-label="ANOD projects, top">
      <svg width="18" height="18" viewBox="0 0 101 100" aria-hidden="true"><rect class="r" width="101" height="14"/><polygon points="50.5,24 101,100 0,100"/></svg>
      ANOD <span>Projects</span>
    </a>
    <nav><a href="#index">Index</a><a href="#sheets">Sheets</a><a href="#group">Documents</a></nav>
  </div>
</header>

<main class="page">
  <section class="title">
    <div>
      <h1>Projects and proofs of concept</h1>
      <p>What ANOD is building: what each project is, where it stands, and where its code and documents live.</p>
    </div>
    <div class="meta" id="meta"></div>
  </section>

  <h2 id="index">Index <span class="mono" id="count"></span></h2>
  <div class="tbl-wrap">
    <table>
      <thead><tr><th>ID</th><th>Project</th><th class="hide-sm">Division</th><th>Status</th><th>Stage</th><th class="hide-sm">Repo</th><th class="hide-sm">Updated</th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </div>

  <h2 id="sheets">Project sheets</h2>
  <div id="out"></div>
</main>

<footer>
  <div class="page">
    <span>ANOD · Engineering the Future</span>
    <span class="mim"><i style="background:var(--red)"></i><i style="background:var(--green)"></i>Made in Morocco</span>
  </div>
</footer>

<!-- Project data lives in projects.js -->
<script src="projects.js"></script>
<script>
const STAGES = ["Concept", "Prototype", "Custom PCB", "Testing", "Demo"];
const LABEL = {active: "In progress", next: "Next", idea: "Idea", paused: "Paused", done: "Done"};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };
const link = (u, text) => safeUrl(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text);
const repoName = u => { try { return new URL(u).pathname.replace(/^\/|\/$/g, "") || host(u); } catch (e) { return u; } };

function stepClass(p, k) {
  if (p.status === "done" || k < p.stage) return "on";
  if (k === p.stage && p.status === "active") return "now";
  return "";
}

function render() {
  const P = (window.PROJECTS || []).map(p => ({...p,
    status: LABEL[p.status] ? p.status : "idea",
    stage: Math.max(0, Math.min(STAGES.length - 1, parseInt(p.stage, 10) || 0))}))
    .sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, {numeric: true}));
  const G = window.GROUP_DOCS || [];

  const dates = P.map(p => p.updated).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d || "")).sort();
  document.getElementById("meta").innerHTML =
    `<span>Projects</span><b>${P.length}</b><span>In progress</span><b>${P.filter(p => p.status === "active").length}</b><span>Last update</span><b>${dates.pop() || "—"}</b>`;
  document.getElementById("count").textContent = `${P.length} ${P.length === 1 ? "entry" : "entries"}`;

  document.getElementById("list").innerHTML = P.map(p => `
    <tr class="row" data-go="${esc(p.id)}">
      <td class="id">${esc(p.id)}</td>
      <td class="name"><a href="#${esc(p.id)}">${esc(p.name)}</a></td>
      <td class="hide-sm muted">${esc(p.division)}</td>
      <td><span class="status ${p.status}"><i></i>${LABEL[p.status]}</span></td>
      <td><span class="bar" aria-label="${STAGES[p.stage]}">${STAGES.map((_, k) => `<span class="${stepClass(p, k)}"></span>`).join("")}</span>
          <span class="mono muted" style="display:block;margin-top:4px">${STAGES[p.stage]}</span></td>
      <td class="hide-sm repo">${safeUrl(p.repo) ? link(p.repo, "GitHub ↗") : '<span class="muted">—</span>'}</td>
      <td class="hide-sm mono muted">${esc(p.updated || "—")}</td>
    </tr>`).join("");
  document.querySelectorAll("tr.row").forEach(r => r.addEventListener("click", e => {
    if (!e.target.closest("a")) location.hash = r.dataset.go;
  }));

  const docs = raw => { const list = (raw || []).filter(Array.isArray); return list.length
    ? `<ul class="docs">${list.map(([t, u]) => `<li><span>${link(u, t)}</span><span class="k">${esc(host(u))}</span></li>`).join("")}</ul>`
    : `<p class="none">None yet.</p>`; };

  document.getElementById("out").innerHTML = P.map(p => {
    const facts = Object.entries(p.facts && typeof p.facts === "object" ? p.facts : {});
    const log = (p.log || []).filter(Array.isArray);
    if (safeUrl(p.repo)) facts.unshift(["Repository", null, p.repo]);
    return `
    <article class="sheet" id="${esc(p.id)}">
      <div class="sheet-head">
        <h3>${esc(p.name)}</h3>
        <span class="mono">${esc(p.id)} · ${esc(p.division)} · ${LABEL[p.status]}</span>
      </div>
      <p class="summary">${esc(p.summary)}</p>
      <div class="cols">
        <div>${facts.length ? `<dl>${facts.map(([k, v, u]) =>
          `<dt>${esc(k)}</dt><dd>${u ? link(u, repoName(u)) : esc(v)}</dd>`).join("")}</dl>` : ""}</div>
        <div>
          <div class="block"><h4>Stage</h4>
            <ol class="stages">${STAGES.map((s, k) => `<li class="${stepClass(p, k)}">${s}</li>`).join("")}</ol>
          </div>
          <div class="block"><h4>Log</h4>
            ${log.length ? `<ul class="log">${log.map(([d, t]) => `<li><time>${esc(d)}</time><span>${esc(t)}</span></li>`).join("")}</ul>` : `<p class="none">No entries yet.</p>`}
          </div>
          <div class="block"><h4>Documents</h4>${docs(p.docs)}</div>
        </div>
      </div>
    </article>`;
  }).join("") + `
    <article class="sheet" id="group">
      <div class="sheet-head"><h3>Group documents</h3><span class="mono">ANOD · all divisions</span></div>
      <div class="cols"><div></div><div class="block">${docs(G)}</div></div>
    </article>`;

  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
}

if (!Array.isArray(window.PROJECTS)) {
  document.getElementById("out").innerHTML =
    `<p class="err">projects.js could not be read. Check the last edit: a missing comma between projects, or a missing quote or bracket, is the usual cause.</p>`;
} else {
  render();
}
</script>
</body>
</html>
